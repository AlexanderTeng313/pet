<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>动画切换间隔</title>
  <link rel="stylesheet" href="./panel.css" />
  <style>
    /* 无边框窗口：头部可拖拽，按钮/输入框保持可点击 */
    .head { -webkit-app-region: drag; cursor: grab; }
    .head .close { -webkit-app-region: no-drag; cursor: pointer; }
    .form, .form input, .form select, .btns button { -webkit-app-region: no-drag; }
    .head .close { margin-left: auto; flex-shrink: 0; }
    .row {
      margin-top: 16px; display: flex; align-items: center; justify-content: center;
      gap: 8px; flex-wrap: nowrap;
    }
    .row input[type="number"] {
      width: 84px; box-sizing: border-box; padding: 8px 6px; font-size: 16px; text-align: center;
      border: 1px solid var(--border, rgba(0,0,0,.12)); border-radius: 8px;
      background: var(--input-bg, #fff); color: var(--text-primary, #222); font-family: inherit;
    }
    .row input:focus, .row select:focus { outline: none; border-color: var(--accent, #f5a623); }
    .row input::-webkit-outer-spin-button, .row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .row select {
      padding: 8px 6px; font-size: 14px; border: 1px solid var(--border, rgba(0,0,0,.12));
      border-radius: 8px; background: var(--input-bg, #fff); color: var(--text-primary, #222); font-family: inherit;
    }
    .cur { margin-top: 10px; text-align: center; font-size: 12px; color: var(--text-secondary, #999); }
    .cur b { color: var(--text-primary, #222); font-variant-numeric: tabular-nums; }
    .btns { margin-top: 16px; display: flex; gap: 8px; justify-content: center; }
    .btns button {
      font-family: inherit; font-size: 13px; padding: 8px 22px; border-radius: 9px;
      border: 1px solid var(--border, rgba(0,0,0,.12)); background: var(--btn-bg, #fff);
      color: var(--text-primary, #222); cursor: pointer;
    }
    .btns button.primary { background: var(--accent, #f5a623); border-color: transparent; color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="head">
      <span class="title">⏱ 动画切换间隔</span>
      <button id="close" class="close" title="关闭">✕</button>
    </div>
    <div class="form">
      <div class="row">
        <input id="num" type="number" min="1" max="86400" step="1" value="12" />
        <select id="unit">
          <option value="1000">秒</option>
          <option value="60000">分钟</option>
          <option value="3600000">小时</option>
        </select>
      </div>
      <div class="cur">当前：<b id="cur">12 秒</b></div>
      <div class="btns">
        <button id="apply" class="primary">确定</button>
        <button id="cancel">取消</button>
      </div>
    </div>
  </div>
  <script src="./switch-interval.js"></script>
</body>
</html>
